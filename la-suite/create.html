<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Créer une capsule — La Suite</title>
<meta name="description" content="Créez votre capsule temporelle La Suite et partagez-la ensuite avec vos invités grâce à un QR code personnalisable.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous">
<link rel="stylesheet" href="styles.css?v=20260927-datefr1">
</head>
<body class="create-page suite-shell-page">
<header class="forge-style-header">
  <div class="suite-container suite-topbar">
    <a class="suite-brand" href="index.html" aria-label="La Suite — Accueil">
      <img src="assets/la-suite-logo.webp?v=20260927-hq" alt="Logo La Suite — Capsule temporelle">
    </a>
    <button class="suite-burger" data-suite-burger type="button" aria-label="Ouvrir le menu" aria-expanded="false">
      <i class="fa-solid fa-bars"></i>
    </button>
    <nav class="suite-nav" data-suite-nav>
      <ul>
        <li><a href="index.html#principe">Le principe</a></li>
        <li><a href="index.html#tarifs">Tarifs</a></li>
        <li><a class="is-active" href="create.html">Créer la capsule</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="wrap create-wrap">
  <section class="create-intro">
    <h1>Créez votre capsule</h1>
  </section>

  <form class="form-shell create-form" id="create-capsule" action="#" onsubmit="return false;">
    <div class="field">
      <label for="couple">Nom de la capsule</label>
      <input id="couple" name="couple" required maxlength="50" placeholder="Julie & Thomas">
      <small class="field-help">50 caractères maximum.</small>
    </div>

    <div class="field">
      <label for="wedding_date">Date de l'événement</label>
      <div class="date-fr-wrap">
        <input id="wedding_date_display" class="date-fr-display" type="text" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="JJ/MM/AAAA" aria-label="Date de l'événement au format jour mois année" required>
        <button class="date-fr-button" id="wedding_date_button" type="button" aria-label="Ouvrir le calendrier">
          <i class="fa-regular fa-calendar"></i>
        </button>
        <input id="wedding_date" name="wedding_date" class="date-fr-native" type="date" lang="fr-FR" tabindex="-1" aria-hidden="true">
      </div>
    </div>

    <div class="field">
      <label for="email">Adresse e-mail</label>
      <input id="email" name="email" type="email" autocomplete="off" required placeholder="vous@exemple.fr">
      <small class="field-help" id="email-help">Un lien sécurisé vous sera envoyé pour finaliser la création.</small>
    </div>

    <button class="btn primary create-submit" type="submit">Créer ma capsule</button>
    <div id="status" class="status"></div>
  </form>
</main>

<footer class="forge-style-footer">
  <div class="suite-container footerbar">
    <div class="legal">© 2023–2026 La Forge à Souvenirs</div>
    <div class="social">
      <a href="https://www.facebook.com/people/La-Forge-%C3%A0-Souvenirs/100095037515785/" target="_blank" rel="noopener" aria-label="Facebook La Forge à Souvenirs">
        <i class="fa-brands fa-facebook"></i>
      </a>
    </div>
  </div>
</footer>

<script src="suite-shell.js?v=20260927-shell1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=20260927-1"></script>
<script src="app.js?v=20260927-datefr1"></script>
</body>
</html>
