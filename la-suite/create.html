<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Créer une capsule — La Suite</title>
<meta name="description" content="Créez votre capsule temporelle La Suite et partagez-la ensuite avec vos invités grâce à un QR code personnalisable.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="create-page">
<header>
  <div class="wrap top">
    <a class="header-logo-link" href="index.html" aria-label="La Suite">
      <img src="assets/la-suite-logo.webp" class="header-logo" alt="La Suite — Capsule temporelle">
    </a>
    <nav><a href="index.html">Présentation</a><a href="../">La Forge à Souvenirs</a></nav>
  </div>
</header>

<main class="wrap create-wrap">
  <section class="create-intro">
    <h1>Créez votre capsule</h1>
  </section>

  <form class="form-shell create-form" id="create-capsule">
    <div class="field">
      <label for="couple">Nom de la capsule</label>
      <input id="couple" name="couple" required maxlength="50" placeholder="Julie & Thomas">
      <small class="field-help">50 caractères maximum.</small>
    </div>

    <div class="field">
      <label for="wedding_date">Date de l'événement</label>
      <div class="date-picker-wrap">
        <input id="wedding_date" name="wedding_date" type="date" lang="fr" required>
        <button class="date-picker-button" id="wedding_date_button" type="button" aria-label="Ouvrir le calendrier">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 2v3M17 2v3M3.5 9h17M5 4.5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-12a2 2 0 0 1 2-2Z"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="field">
      <label for="email">Adresse e-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" required placeholder="vous@exemple.fr">
      <small class="field-help" id="email-help">Un lien sécurisé vous sera envoyé pour finaliser la création.</small>
    </div>

    <button class="btn primary create-submit" type="submit">Créer ma capsule</button>
    <div id="status" class="status"></div>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
