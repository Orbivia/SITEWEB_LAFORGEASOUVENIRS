<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Créer une capsule — La Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><div class="wrap top"><a class="brand" href="index.html">La Forge à Souvenirs<small>La Suite</small></a><nav><a href="index.html">Présentation</a><a href="../">Site principal</a></nav></div></header>
<main class="wrap">
<form class="form-shell" id="create-capsule">
<h1>Créer une capsule</h1>
<p class="hint">Créez l'espace de votre événement. Chaque invité choisira lui-même quand son souvenir devra vous être livré.</p>
<div class="grid">
<div class="field"><label for="couple">Nom de la capsule</label><input id="couple" name="couple" required placeholder="Julie & Thomas"></div>
<div class="field"><label for="wedding_date">Date de l'événement</label><input id="wedding_date" name="wedding_date" type="date" required></div>
</div>
<div class="field"><label for="welcome_message">Petit message d'accueil</label><textarea id="welcome_message" name="welcome_message" placeholder="Laissez-nous un souvenir à découvrir plus tard…"></textarea></div>
<div class="notice">Après création, vous pourrez ajouter votre vidéo d'accueil et récupérer le QR code à partager.</div>
<div style="margin-top:18px"><button class="btn primary" type="submit">Créer ma capsule</button></div>
<div id="status" class="status"></div>
</form>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
</body></html>
